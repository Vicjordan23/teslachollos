name: Importar ingresos de Amazon (archivo)

# La tarea diaria de Chrome lee el informe de Amazon Afiliados y sube datos-ingresos/amazon.json;
# este workflow lo carga en ingresos_afiliados (panel /admin/afiliados) con los secretos de Supabase del repo.
on:
  push:
    branches: [main]
    paths:
      - "datos-ingresos/amazon.json"
      - "scripts/importar-ingresos-archivo.mjs"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mostrar lo que cargaría"
        type: boolean
        default: false

concurrency: importar-ingresos-archivo

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cargar ingresos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '--prueba' || '' }}
        run: node scripts/importar-ingresos-archivo.mjs $PRUEBA
